<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MiniWorld Admin Dashboard</title>
  <style>
    body {
      margin: 0;
      font-family: "Poppins", sans-serif;
      background: rgba(15, 15, 15, 0.95);
      color: #fff;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 30px;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 20px;
      color: #00eaff;
      text-shadow: 0 0 8px #00eaff;
    }

    .stats {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      margin-bottom: 30px;
    }

    .card {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 20px 30px;
      min-width: 150px;
      text-align: center;
      box-shadow: 0 0 15px rgba(0, 234, 255, 0.3);
      transition: 0.3s;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 0 25px rgba(0, 234, 255, 0.6);
    }

    ul {
      list-style: none;
      padding: 0;
      margin-top: 20px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 15px;
      padding: 20px;
      width: 90%;
      max-width: 600px;
    }

    li {
      padding: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
    }

    li:last-child {
      border-bottom: none;
    }

    footer {
      margin-top: auto;
      font-size: 14px;
      color: #aaa;
      text-align: center;
      padding: 15px;
    }
  </style>
</head>
<body>

  <h1>🚀 MiniWorld Admin Dashboard</h1>

  <div class="stats">
    <div class="card">
      <h3>Total Users</h3>
      <p id="total-users">--</p>
    </div>
    <div class="card">
      <h3>Active Users</h3>
      <p id="active-users">--</p>
    </div>
    <div class="card">
      <h3>Premium Users</h3>
      <p id="premium-users">--</p>
    </div>
    <div class="card">
      <h3>Version</h3>
      <p id="version">--</p>
    </div>
    <div class="card">
      <h3>Developer</h3>
      <p id="developer">--</p>
    </div>
  </div>

  <h2>👥 User List</h2>
  <ul id="user-list">
    <li>Loading...</li>
  </ul>

  <footer>
    &copy; 2025 MiniWorld | Developed by <strong>Karan Singh</strong>
  </footer>

  <script>
    async function loadData() {
      try {
        const baseURL = "https://mini-world-eight.vercel.app";

        // Fetch stats
        const statsRes = await fetch(`${baseURL}/api/stats`);
        const stats = await statsRes.json();

        // Fetch users
        const usersRes = await fetch(`${baseURL}/api/users`);
        const users = await usersRes.json();

        // Fetch settings
        const settingsRes = await fetch(`${baseURL}/api/settings`);
        const settings = await settingsRes.json();

        // Update dashboard
        document.getElementById("total-users").innerText = stats.data.totalUsers;
        document.getElementById("active-users").innerText = stats.data.activeUsers;
        document.getElementById("premium-users").innerText = stats.data.premiumUsers;
        document.getElementById("version").innerText = settings.version;
        document.getElementById("developer").innerText = settings.developer;

        // User list
        let userList = "";
        users.users.forEach(u => {
          userList += `<li>${u.name} (UID: ${u.uid}) — ${u.status}</li>`;
        });
        document.getElementById("user-list").innerHTML = userList;
      } catch (error) {
        console.error(error);
        alert("Failed to load dashboard data!");
      }
    }

    window.onload = loadData;
  </script>

</body>
</html>
