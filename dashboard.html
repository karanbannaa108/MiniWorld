<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🚀 MiniWorld Admin Dashboard</title>
  <style>
    body {
      background: rgba(20, 20, 20, 0.9);
      font-family: 'Poppins', sans-serif;
      color: white;
      text-align: center;
      margin: 0;
      padding: 0;
    }

    h1 {
      margin-top: 20px;
      color: #00ffff;
      text-shadow: 0 0 10px #00ffff;
    }

    .status-bar {
      background: rgba(0, 255, 0, 0.15);
      border-radius: 10px;
      padding: 8px;
      width: 160px;
      margin: 10px auto;
      font-size: 14px;
      font-weight: bold;
    }

    .status-offline {
      background: rgba(255, 0, 0, 0.2);
      color: #ff4c4c;
    }

    .card-container {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 15px;
      margin: 20px;
    }

    .card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      border-radius: 15px;
      padding: 15px 25px;
      min-width: 150px;
      box-shadow: 0 0 15px rgba(0, 255, 255, 0.2);
      transition: 0.3s;
    }

    .card:hover {
      transform: scale(1.05);
      box-shadow: 0 0 25px rgba(0, 255, 255, 0.4);
    }

    .user-list {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 15px;
      width: 80%;
      margin: 20px auto;
      padding: 15px;
      text-align: left;
      box-shadow: 0 0 15px rgba(0, 255, 255, 0.1);
    }

    .user-list li {
      list-style: none;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    button {
      background: #00ffff;
      color: black;
      border: none;
      padding: 10px 20px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.3s;
    }

    button:hover {
      background: #00cccc;
    }

    /* Loader */
    .loader {
      display: none;
      border: 4px solid rgba(255, 255, 255, 0.2);
      border-top: 4px solid #00ffff;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      margin: 20px auto;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <h1>🚀 MiniWorld Admin Dashboard</h1>

  <div id="statusBar" class="status-bar">🟢 Online</div>

  <button onclick="loadData()">🔄 Refresh</button>

  <div class="loader" id="loader"></div>

  <div class="card-container">
    <div class="card"><h3>Total Users</h3><p id="total-users">0</p></div>
    <div class="card"><h3>Active Users</h3><p id="active-users">0</p></div>
    <div class="card"><h3>Premium Users</h3><p id="premium-users">0</p></div>
    <div class="card"><h3>Developer</h3><p id="developer">-</p></div>
    <div class="card"><h3>Version</h3><p id="version">-</p></div>
  </div>

  <h3>👤 User List</h3>
  <ul id="user-list" class="user-list"></ul>

  <script>
    async function loadData() {
      const loader = document.getElementById("loader");
      const statusBar = document.getElementById("statusBar");
      loader.style.display = "block";

      try {
        // Fetch all APIs
        const stats = await fetch('/api/stats').then(r => r.json());
        const users = await fetch('/api/users').then(r => r.json());
        const settings = await fetch('/api/settings').then(r => r.json());

        // Update Dashboard
        document.getElementById("total-users").innerText = stats.data.totalUsers;
        document.getElementById("active-users").innerText = stats.data.activeUsers;
        document.getElementById("premium-users").innerText = stats.data.premiumUsers;
        document.getElementById("developer").innerText = settings.developer;
        document.getElementById("version").innerText = settings.version;

        // User List
        let listHTML = "";
        users.users.forEach(u => {
          listHTML += `<li>${u.name} (UID: ${u.uid}) — ${u.status}</li>`;
        });
        document.getElementById("user-list").innerHTML = listHTML;

        statusBar.className = "status-bar";
        statusBar.innerText = "🟢 Online";
      } catch (e) {
        console.error(e);
        alert("Failed to load dashboard data!");
        statusBar.className = "status-bar status-offline";
        statusBar.innerText = "🔴 Offline";
      } finally {
        loader.style.display = "none";
      }
    }

    window.onload = loadData;
  </script>
</body>
</html>
