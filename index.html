<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MiniWorld Login</title>
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: radial-gradient(circle at top left, #0f2027, #203a43, #2c5364);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .login-box {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(15px);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
      width: 350px;
      text-align: center;
    }
    h2 {
      margin-bottom: 15px;
      color: #00e6ff;
    }
    input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: none;
      border-radius: 10px;
      outline: none;
      background: rgba(255, 255, 255, 0.1);
      color: white;
    }
    button {
      width: 48%;
      padding: 10px;
      margin: 10px 1%;
      border: none;
      border-radius: 10px;
      background: linear-gradient(90deg, #007bff, #00ffff);
      color: white;
      cursor: pointer;
      font-weight: 600;
      transition: 0.3s;
    }
    button:hover { opacity: 0.8; }
    .msg { margin-top: 15px; font-weight: 600; }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>🚀 MiniWorld</h2>
    <input type="text" id="uid" placeholder="UID (10 digits)" maxlength="10" />
    <input type="password" id="password" placeholder="Password" />
    <div>
      <button onclick="signIn()">Sign In</button>
      <button onclick="getUID()">Get UID</button>
    </div>
    <div id="msg" class="msg"></div>
  </div>

  <script>
    async function signIn() {
      const uid = document.getElementById("uid").value.trim();
      const password = document.getElementById("password").value.trim();
      const msg = document.getElementById("msg");

      if (!uid || !password) {
        msg.style.color = "red";
        msg.innerHTML = "⚠️ Enter UID and Password!";
        return;
      }

      try {
        const res = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ uid, password })
        });
        const data = await res.json();

        if (data.success) {
          msg.style.color = "lime";
          msg.innerHTML = `✅ ${data.message}`;
          setTimeout(() => {
            window.location.href = "/dashboard.html";
          }, 2000);
        } else {
          msg.style.color = "red";
          msg.innerHTML = `❌ ${data.message}`;
        }
      } catch (err) {
        msg.style.color = "red";
        msg.innerHTML = "⚠️ Server Error!";
      }
    }

    function getUID() {
      window.open("https://t.me/MiniWorldUIDBot", "_blank");
    }
  </script>
</body>
</html>
